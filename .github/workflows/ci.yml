name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  gate:
    name: Drift-Gate + Godot-Smoke-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hartes Gate zuerst: braucht kein Godot und schlägt am schnellsten fehl.
      - name: Drift-Gate (strict)
        run: python3 scripts/check_index.py --strict

      - name: Godot ${{ env.GODOT_VERSION }} cachen
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Godot installieren
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip "${base}/${file}.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/"${file}" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Godot in den PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Godot-Smoke-Tests (headless)
        run: python3 tests/test_project_loads.py

  # roi-check läuft bewusst NICHT in CI: er prüft den lokalen OTel-Collector
  # auf 127.0.0.1:4318 (ADR-0003) und wäre auf einem Runner immer rot.
