name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Drift-Gate + TypeScript + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hartes Doku-Gate zuerst: braucht kein npm und schlägt am schnellsten fehl.
      - name: Drift-Gate (strict)
        run: python3 scripts/check_index.py --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --legacy-peer-deps ist Pflicht: @vitejs/plugin-react v6 verlangt Vite 8,
      # das Projekt bleibt bei Vite 5 (docs/TECH_STACK.md).
      - name: Abhängigkeiten
        run: npm install --legacy-peer-deps

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build + Budget
        run: npm run build

  # roi-check läuft bewusst NICHT in CI: er prüft den lokalen OTel-Collector
  # auf 127.0.0.1:4318 (ADR-0003) und wäre auf einem Runner immer rot.
