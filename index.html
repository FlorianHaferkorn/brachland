<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: Vollbild auf dem Handy, kein
         versehentliches Pinch-Zoom während der Steuerung. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BRACHLAND</title>
    <!-- Weltdaten sofort anfordern, nicht erst wenn das Bündel geparst ist.
         Seit D82 holt die Anwendung `oental.json` selbst, statt sie aus dem
         Precache zu bekommen. Ohne dieses `preload` beginnt der Griff erst nach
         1,3 MB JavaScript. Gemessen auf schnellem 3G, bis die Weltdaten
         **vollständig da** sind — die Zahl, an der es hängt, weil vorher nichts
         zu spielen ist:

           Precache (alt)      9,5 s
           D82 ohne preload    9,5 s
           D82 mit preload     5,4 s   ← das hier

         Es kostet das `DOMContentLoaded` (3,2 → 5,1 s), weil der Griff mit dem
         Bündel um die Leitung konkurriert. Das ist der richtige Tausch: Bis das
         Dokument steht, sieht man ohnehin nur den Hintergrund. `fetch()` in
         `weltladen.ts` greift dieselbe Antwort ab, ohne sie zweimal zu holen. -->
    <link rel="preload" href="/world/oental.json" as="fetch" crossorigin="anonymous" />
    <style>
      html, body, #app { height: 100%; margin: 0; background: #0d1210; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
