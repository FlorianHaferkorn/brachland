<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: Vollbild auf dem Handy, kein
         versehentliches Pinch-Zoom während der Steuerung. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BRACHLAND</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0d1210; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
