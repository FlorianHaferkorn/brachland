<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630">
<rect width="100%" height="100%" fill="#1a1c1a"/>
<text x="66" y="32" font-size="18" font-weight="700" fill="#e8e6e0">Warum Bachläufe in der Ferne fliegen — 255 m Bachlauf im Œntal</text>
<text x="66" y="54" font-size="12.5" fill="#a8a49c">Höhen relativ zu dem Gelände, das aus der Nähe gezeichnet wird (Nulllinie). Weiter weg wird das Netz gröber, und der Boden sackt unter dem Band weg.</text>
<text x="66" y="74" font-size="12.5" fill="#a8a49c">Der Abschnitt mit der längsten zusammenhängenden Luft unter dem Band: bis 2,36 m ab 420 m Kameraabstand. Nach der Böschung bleiben davon höchstens 0,27 m — und die nur punktuell.</text>
<text x="66" y="106" font-size="14.5" font-weight="600" fill="#e8e6e0">vorher — das Band bleibt oben, der gezeichnete Boden nicht</text>
