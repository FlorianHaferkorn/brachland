font-size="13" fill="#a8a49c">colorTan</text><rect x="200" y="396.91999999999996" width="150" height="30" fill="#ffd7b0"/><text x="358" y="416.91999999999996" font-size="12" fill="#7d7a72">#ffd7b0</text><text x="440" y="416.91999999999996" font-size="14" fill="#7d7a72">→</text><rect x="470" y="396.91999999999996" width="150" height="30" fill="#a8926a"/><text x="628" y="416.91999999999996" font-size="12" fill="#7d7a72">#a8926a</text><text x="720" y="94" font-size="13" font-weight="600" fill="#e8e6e0">Grashöhen</text><text x="720" y="112" font-size="11.5" fill="#a8a49c">vorher: alles 0,35 m</text><line x1="712" y1="560" x2="960" y2="560" stroke="#6f7a5c" stroke-width="1.5"/><rect x="720" y="496.47058823529414" width="26" height="63.529411764705884" fill="#4a5940"/><text x="733" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.18</text><rect x="758" y="475.29411764705884" width="26" height="84.70588235294117" fill="#4a5940"/><text x="771" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.24</text><rect x="796" y="440" width="26" height="120" fill="#4a5940"/><text x="809" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.34</text><rect x="834" y="390.5882352941177" width="26" height="169.41176470588235" fill="#4a5940"/><text x="847" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.48</text><rect x="872" y="341.1764705882353" width="26" height="218.8235294117647" fill="#4a5940"/><text x="885" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.62</text><rect x="910" y="260" width="26" height="300" fill="#4a5940"/><text x="923" y="576" font-size="10.5" fill="#7d7a72" text-anchor="middle">0.85</text><line x1="712" y1="436.47058823529414" x2="960" y2="436.47058823529414" stroke="#9c6f52" stroke-width="1.5" stroke-dasharray="6 4"/><text x="712" y="430.47058823529414" font-size="11" fill="#9c6f52">0,35 m — die alte Einheitshöhe</text><text x="42" y="630" font-size="12.5" fill="#a8a49c">Dazu: 22.638 Büsche wurden schwarz gezeichnet, weil den Dateien COLOR_0 fehlte und das Material vertexColors verlangt.</text><text x="42" y="650" font-size="12.5" fill="#a8a49c">Von einem Findling (Stein + Gras + Schnee) zeichnete die Szene nur das erste von drei Teilen.</text><text x="42" y="670" font-size="12.5" fill="#a8a49c">Beides blockt jetzt npm run quality — gegengeprüft, indem das Attribut absichtlich entfernt wurde.</text></svg>