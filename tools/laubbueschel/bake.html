<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f0f">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Laubbüschel backen (D282): Ausschnitte aus der Aussenkrone eines Poly-Haven-Baums orthografisch rendern.
// Blick von aussen auf die Krone (radial), Tiefenscheibe = Kantenlänge, hintere Blätter per Nebel abgedunkelt
// (Selbstverschattung im Büschel), Licht weich von vorn-oben. Magenta = leer.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const id = q.get('id'), PX = Number(q.get('px') ?? 1024), N = Number(q.get('n') ?? 16), S = Number(q.get('s') ?? 0.5);
const muster = new RegExp(q.get('muster') ?? 'leaf|leaves|twig', 'i');
const gltf = await new GLTFLoader().loadAsync(`/modelle/${id}/${id}.gltf`);
gltf.scene.updateMatrixWorld(true);
const blatt = [];
const kugel = { value: new THREE.Vector4(0, 0, 0, 1) };
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  const ist = muster.test(o.material?.name ?? '') || muster.test(o.name);
  o.visible = ist;
  if (ist) {
    blatt.push(o);
    const alt = o.material;
    o.material = new THREE.MeshLambertMaterial({ map: alt.map, alphaMap: alt.alphaMap, alphaTest: alt.alphaMap || alt.transparent || alt.alphaTest > 0 ? 0.5 : 0, side: THREE.DoubleSide });
    // Kugel-Ausschnitt um den Büschelmittelpunkt statt gerader Kachelkanten (unregelmässig über Rauschen).
    o.material.onBeforeCompile = (sh) => {
      sh.uniforms.uKugel = kugel;
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWelt;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvWelt = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWelt;\nuniform vec4 uKugel;')
        .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
  vec3 dk = vWelt - uKugel.xyz;
  float wob = 0.12 * sin(dk.x * 41.0 + 1.3) * sin(dk.y * 37.0) + 0.08 * sin(dk.z * 53.0 + dk.x * 23.0);
  if (length(dk) > uKugel.w * (1.0 + wob)) discard;`);
    };
  }
});
// Kronenmitte und Aussenpunkte: Ecken der Blattnetze in Weltkoordinaten.
const punkte = [];
const v = new THREE.Vector3();
for (const m of blatt) {
  const p = m.geometry.getAttribute('position');
  const schritt = Math.max(1, Math.floor(p.count / 4000));
  for (let i = 0; i < p.count; i += schritt) punkte.push(v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld).clone());
}
const box = new THREE.Box3().setFromPoints(punkte), mitte = box.getCenter(new THREE.Vector3()), gr = box.getSize(new THREE.Vector3());
const rmax = Math.max(...punkte.map((p) => Math.hypot(p.x - mitte.x, p.z - mitte.z)));
// Aussenkrone: horizontal weit aussen und nicht im unteren Drittel.
const aussen = punkte.filter((p) => Math.hypot(p.x - mitte.x, p.z - mitte.z) > 0.6 * rmax && p.y > box.min.y + 0.35 * gr.y);
let saat = 12345; const zuf = () => ((saat = (saat * 16807) % 2147483647) / 2147483647);
const szene = new THREE.Scene();
szene.add(gltf.scene);
szene.fog = new THREE.Fog(0x000000, 0, 1);  // je Bild neu gesetzt
szene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sonne = new THREE.DirectionalLight(0xffffff, 1.6); szene.add(sonne); szene.add(sonne.target);
const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
r.setClearColor(0xff00ff, 1); r.setSize(PX, PX, false);
const ergebnis = [];
for (let k = 0; k < N && aussen.length; k++) {
  const p = aussen[Math.floor(zuf() * aussen.length)];
  const rad = new THREE.Vector3(p.x - mitte.x, 0, p.z - mitte.z).normalize();
  rad.y = 0.25 + 0.3 * zuf(); rad.normalize();          // leicht von oben, wie der Spieler meist hinsieht
  const kam = new THREE.OrthographicCamera(-S / 2, S / 2, S / 2, -S / 2, S * 0.5, S * 1.5);
  kam.position.copy(p).addScaledVector(rad, S);
  kam.lookAt(p);
  kugel.value.set(p.x, p.y, p.z, S * 0.44);
  szene.fog.color.set(0x000000); szene.fog.near = S * 0.6; szene.fog.far = S * 2.6;  // hintere Blätter dunkler
  sonne.position.copy(p).addScaledVector(rad, 2).add(new THREE.Vector3(0, 2, 0)); sonne.target.position.copy(p);
  r.render(szene, kam);
  ergebnis.push({ nr: k, s: S, png: r.domElement.toDataURL('image/png') });
}
window.__ergebnis = { punkte: punkte.length, aussen: aussen.length, groesse: gr.toArray(), blatt: blatt.map((m) => m.material?.name + '/' + m.name), bilder: ergebnis };
document.title = 'fertig';
</script>
