<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f0f">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
<script type="module">
// Weidenbüschel backen (D283): Poly Haven hat keine Weide. Hängende Ruten prozedural — Rute als dünner Schlauch,
// lanzettliche Blätter (8–13 cm × 1,2–1,8 cm) wechselständig, schräg nach unten, Oberseite graugrün, Unterseite
// silbrig (Salix alba). Je Kachel 0,3 m × 0,9 m, 2–4 Ruten, orthografisch von vorn, hintere Blätter per Nebel dunkler.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const N = Number(q.get('n') ?? 16), B = 0.3, H = 0.9, PX = Number(q.get('px') ?? 384);
let saat = 4242; const zuf = () => ((saat = (saat * 16807) % 2147483647) / 2147483647);
const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
r.setClearColor(0xff00ff, 1); r.setSize(PX, PX * 3, false);
const ober = new THREE.Color(0.20, 0.27, 0.12), unter = new THREE.Color(0.42, 0.47, 0.36), rute = new THREE.Color(0.30, 0.24, 0.12);

function blatt(len, br) {
  // Lanzette: Spitze bei y = len, Stiel bei 0; Mittelrippe als dunklere Mittelreihe.
  const pos = [], col = [], idx = [];
  const n = 8;
  for (let i = 0; i <= n; i++) {
    const t = i / n, w = br * 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), 0.8) * (1 - 0.25 * t);
    pos.push(-w, t * len, 0, 0, t * len, 0.002, w, t * len, 0);
    col.push(1, 1, 1, 0.8, 0.8, 0.8, 1, 1, 1);
  }
  for (let i = 0; i < n; i++) { const a = i * 3; idx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4, a + 1, a + 4, a + 2, a + 2, a + 4, a + 5); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
// Zweiseitig: Vorder- und Rückseite mit eigener Farbe (FrontSide/BackSide).
const matO = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.FrontSide });
const matU = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.BackSide });

const ergebnis = [];
for (let k = 0; k < N; k++) {
  const szene = new THREE.Scene();
  szene.fog = new THREE.Fog(0x000000, 1.3, 2.6);
  szene.add(new THREE.AmbientLight(0xffffff, 1.1));
  const sonne = new THREE.DirectionalLight(0xffffff, 1.5); sonne.position.set(0.4, 2, 1.5); szene.add(sonne);
  const ruten = 2 + Math.floor(zuf() * 3);
  for (let j = 0; j < ruten; j++) {
    // Rute: oben am Kachelrand, hängt mit leichtem Bogen nach unten.
    const x0 = (zuf() - 0.5) * B * 0.6, z0 = (zuf() - 0.5) * 0.2, schwung = (zuf() - 0.5) * 0.12;
    const laenge = H * (0.75 + zuf() * 0.25);
    const kurve = new THREE.CatmullRomCurve3([0, 0.33, 0.66, 1].map((t) => new THREE.Vector3(x0 + schwung * Math.sin(t * 2.5), H / 2 - t * laenge, z0 + 0.03 * t)));
    const rohr = new THREE.Mesh(new THREE.TubeGeometry(kurve, 24, 0.0018, 4), new THREE.MeshLambertMaterial({ color: rute }));
    szene.add(rohr);
    const blaetter = Math.floor(laenge / 0.022);
    for (let i = 2; i < blaetter; i++) {
      const t = i / blaetter, p = kurve.getPointAt(t), tan = kurve.getTangentAt(t);
      const len = 0.08 + zuf() * 0.05, br = 0.012 + zuf() * 0.006;
      const g = blatt(len, br);
      const ton = 0.85 + zuf() * 0.3, gelb = zuf() * 0.08;
      const co = ober.clone().multiplyScalar(ton); co.r += gelb; const cu = unter.clone().multiplyScalar(ton);
      const seite = i % 2 ? 1 : -1;
      for (const [m, c] of [[matO, co], [matU, cu]]) {
        const mm = m.clone(); mm.color = c;
        const b = new THREE.Mesh(g, mm);
        b.position.copy(p);
        // Blatt zeigt schräg nach aussen-unten (30–70° gegen die Rute), um die Rute verdreht.
        b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan.clone());   // tan zeigt die Rute hinab: Blatt hängt
        b.rotateZ(seite * (0.5 + zuf() * 0.7));
        b.rotateY(zuf() * Math.PI * 2);
        szene.add(b);
      }
    }
  }
  const kam = new THREE.OrthographicCamera(-B / 2, B / 2, H / 2, -H / 2, 0.5, 2.5);
  kam.position.set(0, 0, 1.5); kam.lookAt(0, 0, 0);
  r.render(szene, kam);
  ergebnis.push({ nr: k, png: r.domElement.toDataURL('image/png') });
}
window.__ergebnis = { bilder: ergebnis };
document.title = 'fertig';
</script>
